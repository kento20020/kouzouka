<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>構造化ドリル帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="解像度を1段ずつ上げ、各段で「状態×イベント」の全マスを埋める。業務理解からL5シーケンスまでを、パン屋さんの予約アプリで練習し、最後に既存アプリを構造化する約6時間のドリル。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=Klee+One:wght@600&display=swap">
<style>/* レイアウト: 方眼ノートの上に、1枚ずつ問題カードを置いていく学習帳。ダークは青焼き（設計図）。 */
:root {
  --paper: #f6f8fc;
  --grid: #e2e9f3;
  --sheet: #ffffff;
  --sheet-2: #f0f4fa;
  --ink: #1b2640;
  --ink-2: #4b5876;
  --ink-3: #7b87a1;
  --rule: #cdd6e4;
  --pen: #2456c8;
  --pen-soft: #dfe8fb;
  --red: #d33d2c;
  --red-soft: #fbe3df;
  --marker: #ffe55c;
  --ok: #1d8a4b;
  --ok-soft: #dcf2e4;
  --warn-soft: #fff2d6;
  --shadow: 0 1px 0 rgba(27, 38, 64, .06), 0 6px 18px -8px rgba(27, 38, 64, .25);
  --sticky-ink: #1b2640;
  --st-y: #fff1a3;
  --st-p: #ffd5dd;
  --st-g: #cdeed8;
  --st-b: #d5e5ff;
  --st-o: #ffdcc0;
  --st-v: #e5dbff;
  --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --font-display: "Dela Gothic One", "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", sans-serif;
  --font-hand: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --step: 24px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1d38; --grid: #18305a; --sheet: #12284a; --sheet-2: #183257;
    --ink: #e6edf9; --ink-2: #a7b7d6; --ink-3: #7a8db2; --rule: #2a4675;
    --pen: #8db6ff; --pen-soft: #1d3a6b; --red: #ff8b7a; --red-soft: #4a2730;
    --marker: #8a7a1f; --ok: #6fd69a; --ok-soft: #173f33; --warn-soft: #3d3420;
    --shadow: 0 1px 0 rgba(0, 0, 0, .2), 0 10px 24px -10px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1d38; --grid: #18305a; --sheet: #12284a; --sheet-2: #183257;
  --ink: #e6edf9; --ink-2: #a7b7d6; --ink-3: #7a8db2; --rule: #2a4675;
  --pen: #8db6ff; --pen-soft: #1d3a6b; --red: #ff8b7a; --red-soft: #4a2730;
  --marker: #8a7a1f; --ok: #6fd69a; --ok-soft: #173f33; --warn-soft: #3d3420;
  --shadow: 0 1px 0 rgba(0, 0, 0, .2), 0 10px 24px -10px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--step) var(--step);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--paper);
}
img { max-width: 100%; }
h1, h2, h3 { text-wrap: balance; word-break: auto-phrase; line-height: 1.35; margin: 0; }
.q, .goal .lead { word-break: auto-phrase; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 6px; }
mark, .mk { background: linear-gradient(transparent 52%, var(--marker) 52%); color: inherit; padding: 0 .1em; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--sheet-2); padding: .1em .35em; border-radius: 4px; }
pre { margin: 0; }
table { border-collapse: collapse; }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 2px solid var(--rule);
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .02em; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button {
  border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-size: 14px; color: var(--ink-2);
}
.nav button[aria-current="page"] { color: var(--ink); background: var(--pen-soft); font-weight: 700; }
.nav button:hover { color: var(--ink); }
.xp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.xp .lv { font-weight: 700; color: var(--ink); white-space: nowrap; }
.xp .bar { width: 90px; height: 8px; border-radius: 99px; background: var(--sheet-2); overflow: hidden; border: 1px solid var(--rule); }
.xp .bar i { display: block; height: 100%; background: var(--pen); border-radius: 99px; transition: width .6s ease; }
.xp .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- generic ---------- */
main { padding-block: 24px 120px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--ink-3); font-weight: 700; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 2px solid var(--ink); background: var(--sheet); color: var(--ink);
  padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 15px; line-height: 1.2;
  box-shadow: 0 3px 0 var(--ink); transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--pen); border-color: var(--pen); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--pen) 60%, #000); }
:root[data-theme="dark"] .btn.primary { color: #0d1d38; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0d1d38; } }
.btn.ghost { border-color: var(--rule); box-shadow: none; background: transparent; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--red) 60%, #000); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.sm { padding: 6px 12px; font-size: 13px; box-shadow: 0 2px 0 var(--ink); }
.btn.sm.ghost { box-shadow: none; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 16px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--rule); background: var(--sheet-2); color: var(--ink-2); white-space: nowrap; }
.chip.pen { background: var(--pen-soft); color: var(--pen); border-color: transparent; }
.chip.red { background: var(--red-soft); color: var(--red); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.lvtag { font-family: var(--font-display); font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--paper); letter-spacing: .04em; white-space: nowrap; }
.hand { font-family: var(--font-hand); }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }

/* ---------- home ---------- */
.home { display: grid; gap: 28px; }
.goal { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; overflow: hidden; }
.goal .l { padding: 28px; display: grid; gap: 14px; align-content: start; border-right: 2px solid color-mix(in srgb, var(--red) 55%, transparent); }
.goal h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4.6vw, 40px); line-height: 1.25; letter-spacing: .01em; }
.goal .lead { color: var(--ink-2); max-width: 36em; }
.goal .r { padding: 22px 24px; background: var(--sheet-2); display: grid; gap: 10px; align-content: start; min-width: 0; }
.outline { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.outline li { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; }
.outline li.done { border-color: color-mix(in srgb, var(--ok) 50%, var(--rule)); }
.outline .lvtag { font-size: 11px; text-align: center; }
.ring { display: flex; gap: 16px; align-items: center; }
.ring svg { width: 74px; height: 74px; flex: none; }
.ring .pct { font-family: var(--font-display); font-size: 22px; }
.next { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 18px 20px; }
.next .t { flex: 1 1 260px; min-width: 0; }
.next .t b { display: block; font-size: 18px; }

.stairs { display: grid; gap: 10px; }
.stairs h2, .section-h { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.chap { --indent: 0px; margin-left: var(--indent); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; position: relative; }
.chap::before { content: ""; position: absolute; left: -14px; top: -10px; bottom: 50%; width: 14px; border-left: 2px dashed var(--rule); border-bottom: 2px dashed var(--rule); border-bottom-left-radius: 8px; }
.chap:first-of-type::before { display: none; }
.chap.locked { opacity: .55; }
.chap .num { font-family: var(--font-display); font-size: 28px; line-height: 1; color: var(--pen); width: 44px; text-align: center; }
.chap .meta { min-width: 0; display: grid; gap: 4px; }
.chap .meta h3 { font-size: 17px; }
.chap .meta .sub { font-size: 13px; color: var(--ink-2); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--rule); background: var(--sheet); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-3); padding: 0; }
.dot.done { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.dot.cur { border-color: var(--pen); color: var(--pen); box-shadow: 0 0 0 3px var(--pen-soft); }
.dot.boss { border-radius: 8px; }
.dot:disabled { cursor: not-allowed; }
.chap .stampbox { width: 56px; height: 56px; display: grid; place-items: center; }
.stamp-mini { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--red); color: var(--red); display: grid; place-items: center; font-family: var(--font-hand); font-size: 18px; transform: rotate(-12deg); opacity: .9; }
.stamp-empty { width: 48px; height: 48px; border-radius: 50%; border: 2px dashed var(--rule); }

/* ---------- lesson player ---------- */
.player { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
.phead { display: grid; gap: 8px; }
.phead .top { display: flex; align-items: center; gap: 10px; }
.phead .ttl { flex: 1; min-width: 0; }
.phead .ttl b { display: block; font-size: 17px; }
.close { border: 0; background: var(--sheet); width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); font-size: 20px; line-height: 1; flex: none; }
.pbar { display: flex; gap: 3px; }
.pbar i { flex: 1; height: 7px; border-radius: 4px; background: var(--sheet-2); border: 1px solid var(--rule); }
.pbar i.done { background: var(--pen); border-color: var(--pen); }
.pbar i.cur { background: var(--pen-soft); border-color: var(--pen); }
.combo { font-size: 13px; font-weight: 700; color: var(--red); white-space: nowrap; }
.card { padding: 24px; display: grid; gap: 16px; }
.card.boss { border: 2px solid var(--ink); }
.card h2 { font-size: 21px; }
.card .q { font-size: 18px; font-weight: 700; line-height: 1.6; }
.card .body { display: grid; gap: 12px; }
.card .body ul, .card .body ol { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }
.card .body table { width: 100%; font-size: 14px; }
.card .body th, .card .body td { border: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top; }
.card .body th { background: var(--sheet-2); }
.tbl { overflow-x: auto; }
.tbl table { min-width: 520px; }
.box { border: 2px solid var(--ink); border-radius: 8px; padding: 12px 14px; background: var(--sheet); }
.box.red { border-color: var(--red); }
.box.pen { border-color: var(--pen); }
.box h4 { margin: 0 0 4px; font-size: 15px; }
.keypoint { border-left: 4px solid var(--red); padding: 8px 12px; background: var(--red-soft); border-radius: 0 8px 8px 0; font-weight: 700; }
.badge-new { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-2); }

.bubbles { display: grid; gap: 12px; }
.bubble { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; animation: rise .35s ease both; }
.bubble.you { grid-template-columns: minmax(0, 1fr) 44px; }
.bubble.you .av { order: 2; }
.bubble.you .says { justify-self: end; background: var(--pen-soft); }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-hand); font-size: 18px; border: 2px solid var(--ink); background: var(--sheet); }
.av.mentor { border-color: var(--pen); color: var(--pen); }
.av.owner { border-color: #c4721a; color: #c4721a; }
.av.you { border-color: var(--ink-2); color: var(--ink-2); }
.says { background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 4px 14px 14px 14px; padding: 10px 14px; max-width: 100%; }
.bubble.you .says { border-radius: 14px 4px 14px 14px; }
.says .nm { display: block; font-size: 12px; color: var(--ink-3); font-weight: 700; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* choice — マークシート */
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--rule); background: var(--sheet); line-height: 1.6; }
.opt .mk-o { width: 22px; height: 30px; border-radius: 50%; border: 2px solid var(--ink-3); margin-top: -2px; position: relative; }
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt[aria-pressed="true"] .mk-o { border-color: var(--pen); background: var(--pen); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .mk-o { border-color: var(--ok); background: var(--ok); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt .why { display: block; font-size: 14px; color: var(--ink-2); margin-top: 6px; font-family: var(--font-hand); }
.opt:disabled { cursor: default; }

/* sort — 付箋 */
.tray { display: flex; flex-wrap: wrap; gap: 10px; min-height: 56px; padding: 12px; border: 2px dashed var(--rule); border-radius: 10px; background: var(--sheet-2); }
.tray:empty::after { content: "ぜんぶ貼れました"; color: var(--ink-3); font-size: 14px; align-self: center; }
.note {
  --rot: 0deg; transform: rotate(var(--rot)); background: var(--st-y); color: var(--sticky-ink);
  border: 0; padding: 10px 12px; font-size: 14px; line-height: 1.5; text-align: left;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .08), 0 6px 10px -6px rgba(0, 0, 0, .45); border-radius: 2px;
  max-width: 260px; transition: transform .12s ease, box-shadow .12s ease;
}
.note.sel { transform: rotate(0deg) translateY(-4px) scale(1.03); box-shadow: 0 0 0 3px var(--pen), 0 12px 18px -8px rgba(0, 0, 0, .5); }
.note.bad { box-shadow: 0 0 0 3px var(--red); animation: shake .4s ease; }
.note.good { box-shadow: 0 0 0 3px var(--ok); }
.note.c1 { background: var(--st-p); } .note.c2 { background: var(--st-g); } .note.c3 { background: var(--st-b); } .note.c4 { background: var(--st-o); } .note.c5 { background: var(--st-v); }
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.bucket { border: 2px solid var(--ink); border-radius: 10px; background: var(--sheet); min-height: 120px; padding: 10px; display: grid; align-content: start; gap: 8px; text-align: left; }
.bucket.hot { border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-soft); }
.bucket > .bl { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.bucket > .bl small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.bucket .note { max-width: 100%; font-size: 13px; }
@keyframes shake { 0%, 100% { translate: 0; } 25% { translate: -5px; } 75% { translate: 5px; } }

/* order */
.seqlist { display: grid; gap: 8px; counter-reset: s; padding: 0; margin: 0; list-style: none; min-height: 48px; border: 2px dashed var(--rule); border-radius: 10px; padding: 10px; }
.seqlist:empty::after { content: "下のカードをタップして、順番に並べよう"; color: var(--ink-3); font-size: 14px; }
.seqlist li button { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--ink); background: var(--sheet); align-items: center; }
.seqlist li button::before { content: counter(s); font-family: var(--font-display); color: var(--pen); font-size: 18px; text-align: center; }
.seqlist li.bad button { border-color: var(--red); background: var(--red-soft); }
.seqlist li.good button { border-color: var(--ok); background: var(--ok-soft); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.pool button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet-2); text-align: left; }

/* spot */
.spot { display: grid; gap: 8px; }
.seg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); width: 100%; }
.seg .flag { width: 26px; height: 26px; border-radius: 50%; border: 2px dashed var(--ink-3); }
.seg[aria-pressed="true"] { border-color: var(--red); }
.seg[aria-pressed="true"] .flag { border: 3px solid var(--red); border-style: solid; }
.seg.good { background: var(--ok-soft); }
.seg.bad { background: var(--red-soft); }
.seg .why { display: block; font-size: 14px; color: var(--ink-2); font-family: var(--font-hand); margin-top: 4px; }
.seg.mono { font-family: var(--font-mono); font-size: 14px; }

/* grid — 状態×イベント表 */
.sx { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
.sx th, .sx td { border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 0; vertical-align: top; }
.sx tr > *:first-child { border-left: 1px solid var(--rule); }
.sx tr:first-child > * { border-top: 1px solid var(--rule); }
.sx thead th { background: var(--sheet-2); padding: 8px; font-weight: 700; text-align: left; min-width: 120px; }
.sx tbody th { background: var(--sheet-2); padding: 8px; text-align: left; white-space: nowrap; position: sticky; left: 0; z-index: 1; }
.sx td { min-width: 140px; }
.sx .given { padding: 8px; color: var(--ink-2); background: color-mix(in srgb, var(--sheet-2) 60%, transparent); }
.cellbtn { width: 100%; min-height: 64px; text-align: left; border: 0; background: var(--sheet); padding: 8px; font-size: 13px; line-height: 1.45; }
.cellbtn.empty { color: var(--ink-3); background: repeating-linear-gradient(45deg, var(--sheet), var(--sheet) 6px, var(--sheet-2) 6px, var(--sheet-2) 12px); }
.cellbtn.bad { outline: 3px solid var(--red); outline-offset: -3px; background: var(--red-soft); }
.cellbtn.good { background: var(--ok-soft); }
.emptycount { font-weight: 700; }
.emptycount.zero { color: var(--ok); }

.toast { position: fixed; left: 50%; top: calc(72px + env(safe-area-inset-top, 0px)); translate: -50% 0; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; animation: rise .25s ease both; max-width: calc(100% - 32px); }

<header class="topbar" id="topbar"></header>
<main id="main" class="wrap">
  <section class="sheet card" style="max-width:640px;margin:40px auto">
    <h1 style="font-family:var(--font-display);font-weight:400">構造化ドリル帳</h1>
    <p class="muted">読み込んでいます…。表示されない場合は、JavaScript を有効にしてください。</p>
  </section>
</main>
<script>(() => {
"use strict";
/* ---- engine/util.js ---- */
/* ===== util.js : 小さなDOMヘルパー ===== */

const $ = (sel, root = document) => root.querySelector(sel);
/** 今表示しているステップの寿命。ステップが変わると abort され、document へのリスナーも外れる */
let STEP_SIGNAL = null;
const stepListen = (type, fn) => document.addEventListener(type, fn, STEP_SIGNAL ? { signal: STEP_SIGNAL } : undefined);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/** h("div", {class: "x", onclick}, child...) で要素を作る。文字列の子はテキストとして入る */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "text") el.textContent = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, String(v));
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

/** 信頼できる教材のHTML文字列から要素を作る（利用者の入力には使わない） */
function rich(tag, html, attrs = {}) {
  return h(tag, { ...attrs, html });
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  // 元の並びのままだと答えが分かってしまうので、2要素以上なら必ず崩す
  if (a.length > 1 && a.every((x, i) => x === arr[i])) a.push(a.shift());
  return a;
}

function debounce(fn, ms) {
  let t = 0;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));

let toastTimer = 0;
function toast(msg) {
  $(".toast")?.remove();
  const el = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

/** クリップボードへコピー。失敗したら選択できるテキストを出す */
async function copyText(text, fallbackHost) {
  try {
    await navigator.clipboard.writeText(text);
    toast("コピーしました");
    return true;
  } catch {
    if (fallbackHost) {
      fallbackHost.replaceChildren(
        h("p", { class: "small muted" }, "自動でコピーできませんでした。下の文字を選択してコピーしてください。"),
        h("textarea", { class: "w", rows: 8, readonly: true }, text),
      );
      fallbackHost.querySelector("textarea")?.select();
    } else {
      toast("コピーできませんでした");
    }
    return false;
  }
}

const isInClaude = () => typeof window.claude?.use === "function";

/** ファイルとして保存。claude.ai では downloads 機能、それ以外は通常のダウンロード */
async function saveFile(filename, data, mime) {
  if (isInClaude()) {
    const dl = await window.claude.use("downloads").catch(() => null);
    if (!dl) {
      toast("この表示では保存できません。コピーを使ってください");
      return false;
    }
    try {
      await dl.save({ filename, data });
      toast("保存しました");
      return true;
    } catch (e) {
      if (e?.code === "declined") toast("保存をやめました");
      else toast("保存できませんでした。コピーを使ってください");
      return false;
    }
  }
  const blob = new Blob([data], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}

/** 赤ペンの〇（正解）を描くSVG */
function circleMark(size = 56) {
  const svg = `<svg viewBox="0 0 60 60" width="${size}" height="${size}" aria-hidden="true"><path class="draw" d="M30 6c14 0 24 9 24 23 0 15-11 25-25 25C15 54 6 44 6 30 6 18 14 8 27 6" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>`;
  return h("span", { class: "mark", style: { color: "var(--red)" }, html: svg });
}
/** 「おしい」のレ点 */
function checkMark(size = 56) {
  const svg = `<svg viewBox="0 0 60 60" width="${size}" height="${size}" aria-hidden="true"><path class="draw" d="M12 30l12 14L50 12" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return h("span", { class: "mark", style: { color: "var(--red)" }, html: svg });
}
/** はなまる：らせんと花びらを座標から生成する */
function hanamaru(size = 170, level = 3) {
  const cx = 100, cy = 100;
  let spiral = "";
  const turns = level >= 3 ? 2.6 : 1.6;
  for (let t = 0; t <= turns * Math.PI * 2; t += 0.12) {
    const r = 14 + t * 5.2;
    const x = cx + r * Math.cos(t - Math.PI / 2);
    const y = cy + r * Math.sin(t - Math.PI / 2) * 0.92;
    spiral += (spiral ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }
  let petals = "";
  if (level >= 2) {
    const n = 9, R = 74;
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
      const p0 = [cx + R * Math.cos(a0), cy + R * Math.sin(a0)];
      const p1 = [cx + R * Math.cos(a1), cy + R * Math.sin(a1)];
      const am = (a0 + a1) / 2, Rm = R + 22;
      const pm = [cx + Rm * Math.cos(am), cy + Rm * Math.sin(am)];
      petals += `${i ? "" : `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)}`}Q${pm[0].toFixed(1)} ${pm[1].toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
    }
  }
  const svg = `<svg class="bigstamp" viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="はなまる"><g fill="none" stroke="var(--red)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="${spiral}"/>${petals ? `<path d="${petals}"/>` : ""}</g></svg>`;
  return h("div", { html: svg });
}

function fmtMin(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return `${m}分`;
  return `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + "分" : ""}`;
}

/* ---- engine/store.js ---- */
/* ===== store.js : 学習の記録 =====
 * 1. いつもブラウザ（localStorage）に保存する
 * 2. claude.ai の中で開いたときは、本人だけが読める場所（data/users/<id>/progress）にも保存し、
 *    別の端末でも続きから学べるようにする
 */

const STORE_KEY = "kouzouka-drill-v1";

function freshState() {
  return {
    v: 1,
    xp: 0,
    done: {}, // lessonId -> {stars, firstOk, total, at}
    pos: {}, // lessonId -> 途中のステップ番号
    cards: [],
    badges: [],
    answers: {}, // stepKey -> 書いた文章など
    tests: { pre: null, post: null },
    grad: {},
    combo: 0,
    bestCombo: 0,
    missions: 0,
    aiReviews: 0,
    timeMs: 0,
    createdAt: Date.now(),
    updatedAt: 0,
    settings: { theme: "system", free: false },
  };
}

function migrate(raw) {
  const base = freshState();
  if (!raw || typeof raw !== "object") return base;
  const s = { ...base, ...raw };
  s.settings = { ...base.settings, ...(raw.settings || {}) };
  s.tests = { ...base.tests, ...(raw.tests || {}) };
  for (const k of ["done", "pos", "answers", "grad"]) if (!s[k] || typeof s[k] !== "object") s[k] = {};
  for (const k of ["cards", "badges"]) if (!Array.isArray(s[k])) s[k] = [];
  return s;
}

const Store = {
  state: freshState(),
  mode: "local", // "local" | "account"
  listeners: new Set(),
  _ref: null,
  _writing: false,
  _dirty: false,

  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) this.state = migrate(JSON.parse(raw));
    } catch {
      this.state = freshState();
    }
    return this.state;
  },

  onChange(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },

  _notify(reason) {
    for (const fn of this.listeners) {
      try { fn(reason); } catch (e) { console.error(e); }
    }
  },

  _writeLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.state)); } catch { /* 保存できない環境でも学習は続けられる */ }
  },

  /** 利用者の操作で状態が変わったときに呼ぶ */
  save() {
    this.state.updatedAt = Date.now();
    this._writeLocal();
    this._scheduleRemote();
  },

  _scheduleRemote: debounce(function () { Store._pushRemote(); }, 1500),

  async _pushRemote() {
    if (!this._ref) return;
    if (this._writing) { this._dirty = true; return; }
    this._writing = true;
    try {
      await this._ref.set({ state: JSON.parse(JSON.stringify(this.state)) });
    } catch (e) {
      if (e?.code === "unavailable") {
        setTimeout(() => this._pushRemote(), 1500 + Math.random() * 2000);
      } else if (e?.code === "revoked" || e?.code === "invalid_argument" || e?.code === "not_granted") {
        this._ref = null;
        this.mode = "local";
        this._notify("mode");
      }
    } finally {
      this._writing = false;
      if (this._dirty) { this._dirty = false; this._pushRemote(); }
    }
  },

  /** claude.ai の中なら、アカウントの保存場所につなぐ */
  async connect() {
    if (!isInClaude()) return;
    const [db, user] = await Promise.all([
      window.claude.use("db").catch(() => null),
      window.claude.use("user").catch(() => null),
    ]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    let ref;
    try { ref = db.doc("data/users/" + id + "/progress"); } catch { return; }
    try {
      const snap = await ref.get();
      const remote = snap.exists ? snap.data()?.state : null;
      this._ref = ref;
      this.mode = "account";
      if (remote && (remote.updatedAt || 0) > (this.state.updatedAt || 0)) {
        this.state = migrate(JSON.parse(JSON.stringify(remote)));
        this._writeLocal();
        this._notify("remote");
      } else if (this.state.updatedAt > 0) {
        this._pushRemote();
      }
      this._notify("mode");
    } catch {
      this._ref = null;
      this.mode = "local";
    }
  },

  reset() {
    const settings = this.state.settings;
    this.state = freshState();
    this.state.settings = settings;
    this.save();
    this._notify("reset");
  },

  importJSON(text) {
    const data = JSON.parse(text);
    const s = migrate(data.state || data);
    s.updatedAt = Date.now();
    this.state = s;
    this.save();
    this._notify("remote");
  },
};

/* 学習時間：画面が見えていて、最近操作があった時間だけ数える（保存は次の操作のときにまとめて行う） */
const Activity = {
  last: Date.now(),
  tick: Date.now(),
  start() {
    // 書きかけの文章などを、ページを閉じる・裏へ回る瞬間にも保存する
    const flush = () => { Store.state.updatedAt = Date.now(); Store._writeLocal(); Store._pushRemote(); };
    addEventListener("pagehide", flush);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
    const poke = () => { this.last = Date.now(); };
    ["pointerdown", "keydown", "scroll", "input"].forEach((ev) => addEventListener(ev, poke, { passive: true }));
    setInterval(() => {
      const now = Date.now();
      const active = document.visibilityState === "visible" && now - this.last < 120000;
      if (active) Store.state.timeMs += now - this.tick;
      this.tick = now;
    }, 15000);
  },
};

/* ---- engine/ai.js ---- */
/* ===== ai.js : 赤ペンAIコーチ =====
 * claude.ai の中で開いたときは、Claude に答案を添削してもらえる（閲覧者の Claude を使う）。
 * それ以外（GitHub Pages など）では、同じ依頼文をコピーして Claude のチャットに貼れるようにする。
 */

const AI = {
  sample: null,
  state: "unknown", // unknown | ready | off
  async init() {
    if (!isInClaude()) { this.state = "off"; return; }
    this.sample = await window.claude.use("sample").catch(() => null);
    this.state = this.sample ? "ready" : "off";
    document.dispatchEvent(new CustomEvent("ai-state"));
  },
};

function buildReviewPrompt({ task, rubric, answer, example }) {
  return [
    "あなたは「構造化」（要件定義から設計まで、解像度を1段ずつ上げ、各段で状態×イベントの全マスを埋める型）を教える、やさしく的確なコーチです。",
    "初心者が書いた答案を、赤ペン先生として添削してください。",
    "",
    "# 課題",
    task,
    "",
    "# 評価の観点",
    rubric.map((r, i) => `${i + 1}. ${r}`).join("\n"),
    example ? "\n# 見本（参考。これと同じでなくてよい）\n" + example : "",
    "",
    "# 答案",
    answer.trim() || "（未記入）",
    "",
    "# 出力のしかた",
    "- Markdownの記号（#、*、|）は使わず、次の見出しで日本語のプレーンテキストで書く",
    "【よいところ】1〜2点。具体的にほめる",
    "【足りないところ】最大3点。どの観点かを書き、なぜ大事かを1文で添える",
    "【次の一手】すぐ直せることを1つ。書き直し例を1行で示す",
    "【評価】A（型どおりに書けている）／B（あと一歩）／C（もう一度チャレンジ）のどれか1つと、理由を1文",
    "- 全体で400〜600字。専門用語を使うときは短く言い換える",
  ].join("\n");
}

/** 添削ボックス：AIが使えればボタン、使えなければ依頼文のコピー */
function coachBox(getPayload) {
  const out = h("div", { class: "out", "aria-live": "polite" });
  const note = h("p", { class: "tiny muted" });
  const fallback = h("div");
  let ctl = null;

  const askBtn = h("button", { class: "btn red sm", type: "button" }, "赤ペンAIに添削してもらう");
  const stopBtn = h("button", { class: "btn ghost sm", type: "button", hidden: true }, "止める");
  const copyBtn = h("button", { class: "btn ghost sm", type: "button" }, "添削の依頼文をコピー");

  const sync = () => {
    const ready = AI.state === "ready";
    askBtn.hidden = !ready;
    note.textContent = ready
      ? "あなたの Claude の利用枠を使って添削します。最初の1回は許可を求められます。"
      : "依頼文をコピーして Claude のチャットに貼ると、同じ観点で添削してもらえます。";
  };
  sync();
  stepListen("ai-state", sync);

  copyBtn.onclick = () => copyText(buildReviewPrompt(getPayload()), fallback);
  stopBtn.onclick = () => ctl?.abort();
  askBtn.onclick = async () => {
    const payload = getPayload();
    if (!payload.answer || payload.answer.trim().length < 10) {
      out.textContent = "もう少し書いてから添削してもらいましょう。";
      return;
    }
    ctl = new AbortController();
    askBtn.disabled = true;
    stopBtn.hidden = false;
    out.textContent = "赤ペンを準備しています…";
    try {
      await AI.sample(buildReviewPrompt(payload), {
        signal: ctl.signal,
        onText: ({ text }) => { out.textContent = text; },
      });
      Store.state.aiReviews += 1;
      Game.badge("ai");
      Store.save();
    } catch (e) {
      out.textContent = e?.text || "";
      const msg = {
        cancelled: "",
        not_granted: "Claude の利用が許可されなかったので、添削は使えません。依頼文のコピーを使ってください。",
        sampling_disabled: "このアカウントでは Claude を使えません。依頼文のコピーを使ってください。",
        rate_limited: "少し時間をおいてから、もう一度ボタンを押してください。",
        session_expired: "もう一度サインインしてから使ってください。",
        refused: "この内容では添削できませんでした。書き方を変えて試してください。",
      }[e?.code];
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e?.code)) {
        AI.state = "off";
        sync();
      }
      if (msg !== "") note.textContent = msg || "うまくつながりませんでした。もう一度押してください。";
    } finally {
      askBtn.disabled = false;
      stopBtn.hidden = true;
    }
  };

  return h("div", { class: "coachbox" },
    h("div", { class: "hd" }, "赤ペンAIコーチ"),
    h("div", { class: "row" }, askBtn, stopBtn, copyBtn),
    note, out, fallback,
  );
}

/* ---- engine/steps.js ---- */
/* ===== steps.js : 問題の種類ごとの表示と採点 =====
 * どの種類も { el, mode, ready(), check(), solve(), reveal() } を返す。
 *   mode "read"  : 読むだけ（次へ）
 *   mode "check" : 答えて「確認する」
 *   mode "self"  : 自分で完了まで進める（ctx.done(結果) を呼ぶ）
 */

const WHO = {
  m: { name: "ミナト先輩", av: "ミ", cls: "mentor" },
  o: { name: "さとう店長", av: "店", cls: "owner" },
  y: { name: "あなた", av: "私", cls: "you" },
  t: { name: "田中さん（パート）", av: "田", cls: "owner" },
};

const Steps = {};

function qTitle(s) {
  return s.q ? rich("p", s.q, { class: "q" }) : null;
}

/* ---------- 会話 ---------- */
Steps.talk = (s) => {
  const list = h("div", { class: "bubbles" });
  s.lines.forEach(([who, text], i) => {
    const w = WHO[who] || WHO.m;
    const b = h("div", { class: "bubble" + (who === "y" ? " you" : ""), style: { animationDelay: i * 0.12 + "s" } },
      h("div", { class: "av " + w.cls, "aria-hidden": "true" }, w.av),
      h("div", { class: "says" }, h("span", { class: "nm" }, w.name), rich("span", text)),
    );
    list.append(b);
  });
  return { el: list, mode: "read" };
};

/* ---------- 解説 ---------- */
Steps.learn = (s) => {
  const parts = [];
  if (s.title) parts.push(h("h2", null, s.title));
  parts.push(rich("div", s.html, { class: "body" }));
  return { el: parts, mode: "read" };
};

/* ---------- 1つ選ぶ（テスト問題も兼ねる） ---------- */
Steps.choice = (s, ctx) => {
  const opts = shuffled(s.opts.map((o, i) => ({ ...o, i })));
  let sel = null;
  let locked = false;
  const btns = [];
  const list = h("div", { class: "opts", role: "group" });
  const clear = () => btns.forEach((b) => { b.classList.remove("right", "wrong"); b.querySelector(".why")?.remove(); });
  for (const o of opts) {
    const b = h("button", { class: "opt", type: "button", "aria-pressed": "false" },
      h("span", { class: "mk-o", "aria-hidden": "true" }),
      h("span", null, rich("span", o.text)),
    );
    b.onclick = () => {
      if (locked) return;
      sel = o;
      clear();
      btns.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      ctx.onChange();
    };
    b._o = o;
    btns.push(b);
    list.append(b);
  }
  const addWhy = (b) => { if (b._o.why) b.lastChild.append(rich("span", b._o.why, { class: "why" })); };
  const lock = () => { locked = true; btns.forEach((b) => (b.disabled = true)); };
  return {
    el: [qTitle(s), list],
    mode: "check",
    ready: () => !!sel,
    selected: () => sel && sel.i,
    check() {
      clear();
      const b = btns.find((x) => x._o === sel);
      if (sel.ok) {
        b.classList.add("right");
        addWhy(b);
        lock();
        return { ok: true };
      }
      b.classList.add("wrong");
      addWhy(b);
      return { ok: false };
    },
    solve() {
      sel = opts.find((o) => o.ok);
      btns.forEach((x) => x.setAttribute("aria-pressed", String(x._o === sel)));
    },
    reveal() {
      clear();
      const b = btns.find((x) => x._o.ok);
      b.classList.add("right");
      addWhy(b);
      lock();
    },
  };
};
Steps.tq = Steps.choice;

/* ---------- 当てはまるものを全部選ぶ ---------- */
Steps.multi = (s, ctx) => {
  const opts = shuffled(s.opts.map((o, i) => ({ ...o, i })));
  const on = new Set();
  let locked = false;
  const btns = [];
  const list = h("div", { class: "opts", role: "group" });
  const clear = () => btns.forEach((b) => { b.classList.remove("right", "wrong"); b.querySelector(".why")?.remove(); });
  for (const o of opts) {
    const b = h("button", { class: "opt", type: "button", "aria-pressed": "false" },
      h("span", { class: "mk-o", "aria-hidden": "true", style: { borderRadius: "5px", height: "22px", marginTop: "2px" } }),
      h("span", null, rich("span", o.text)),
    );
    b.onclick = () => {
      if (locked) return;
      if (on.has(o)) on.delete(o); else on.add(o);
      clear();
      b.setAttribute("aria-pressed", String(on.has(o)));
      ctx.onChange();
    };
    b._o = o;
    btns.push(b);
    list.append(b);
  }
  const mark = (showAll) => {
    clear();
    let wrong = 0;
    for (const b of btns) {
      const o = b._o;
      const picked = on.has(o);
      if (picked && o.ok) b.classList.add("right");
      else if (picked && !o.ok) { b.classList.add("wrong"); wrong++; if (o.why) b.lastChild.append(rich("span", o.why, { class: "why" })); }
      else if (!picked && o.ok) { wrong++; if (showAll) { b.classList.add("right"); if (o.why) b.lastChild.append(rich("span", o.why, { class: "why" })); } }
      if (showAll && o.ok && picked && o.why) b.lastChild.append(rich("span", o.why, { class: "why" }));
    }
    return wrong;
  };
  return {
    el: [qTitle(s), h("p", { class: "small muted" }, "当てはまるものをすべて選んでから「確認する」を押します。"), list],
    mode: "check",
    ready: () => on.size > 0,
    check() {
      const wrong = mark(false);
      const missing = opts.filter((o) => o.ok && !on.has(o)).length;
      if (wrong === 0) { locked = true; btns.forEach((b) => (b.disabled = true)); mark(true); return { ok: true }; }
      const lines = [];
      if (missing) lines.push(`選び忘れが <b>${missing}個</b> あります。`);
      const extra = opts.filter((o) => !o.ok && on.has(o)).length;
      if (extra) lines.push(`当てはまらないものを <b>${extra}個</b> 選んでいます（赤い選択肢の理由を読んでみよう）。`);
      return { ok: false, lines };
    },
    solve() { on.clear(); opts.filter((o) => o.ok).forEach((o) => on.add(o)); btns.forEach((b) => b.setAttribute("aria-pressed", String(on.has(b._o)))); },
    reveal() { this.solve(); mark(true); locked = true; btns.forEach((b) => (b.disabled = true)); },
  };
};

/* ---------- 付箋を仕分ける ---------- */
Steps.sort = (s, ctx) => {
  const items = shuffled(s.items.map((it, i) => ({ ...it, i, rot: (Math.random() * 4 - 2).toFixed(1) })));
  const place = new Map(); // item -> bucketId
  let selected = null;
  const colorOf = (b) => "c" + (s.buckets.findIndex((x) => x.id === b) % 6);
  const tray = h("div", { class: "tray", "aria-label": "まだ貼っていない付箋" });
  const left = h("p", { class: "small", style: { fontWeight: 700 } });
  const bucketEls = new Map();
  const noteEls = new Map();

  const makeNote = (it) => {
    const n = h("button", { class: "note", type: "button", draggable: "true", style: { "--rot": it.rot + "deg" } }, rich("span", it.text));
    n.onclick = (e) => {
      e.stopPropagation();
      // 別の付箋を持っているときに、枠の中の付箋をタップしたら「その枠に貼る」
      if (selected && selected !== it && place.has(it)) { moveTo(place.get(it)); return; }
      selected = selected === it ? null : it;
      render();
    };
    n.ondragstart = (e) => { selected = it; e.dataTransfer?.setData("text/plain", String(it.i)); };
    noteEls.set(it, n);
    return n;
  };
  items.forEach(makeNote);

  const moveTo = (bid) => {
    if (!selected) return;
    if (bid == null) place.delete(selected); else place.set(selected, bid);
    noteEls.get(selected).classList.remove("bad", "good");
    selected = null;
    render();
    ctx.onChange();
  };
  tray.onclick = () => moveTo(null);
  tray.ondragover = (e) => e.preventDefault();
  tray.ondrop = (e) => { e.preventDefault(); moveTo(null); };

  const grid = h("div", { class: "buckets" });
  for (const b of s.buckets) {
    const holder = h("div", { class: "stack", style: { gap: "8px" } });
    const el = h("div", { class: "bucket", role: "button", tabindex: "0", "aria-label": b.label + "に貼る" },
      h("div", { class: "bl" }, h("span", null, b.label), b.hint ? h("small", null, b.hint) : null),
      holder,
    );
    el.onclick = () => moveTo(b.id);
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); moveTo(b.id); } };
    el.ondragover = (e) => { e.preventDefault(); el.classList.add("hot"); };
    el.ondragleave = () => el.classList.remove("hot");
    el.ondrop = (e) => { e.preventDefault(); el.classList.remove("hot"); moveTo(b.id); };
    bucketEls.set(b.id, { el, holder });
    grid.append(el);
  }

  function render() {
    tray.replaceChildren();
    for (const { holder, el } of bucketEls.values()) { holder.replaceChildren(); el.classList.toggle("hot", false); }
    for (const it of items) {
      const n = noteEls.get(it);
      n.classList.toggle("sel", selected === it);
      const bid = place.get(it);
      n.className = n.className.replace(/\bc\d\b/g, "").trim();
      if (bid) { n.classList.add(colorOf(bid)); bucketEls.get(bid).holder.append(n); } else tray.append(n);
    }
    const rest = items.length - place.size;
    left.textContent = rest ? `まだ貼っていない付箋：${rest}枚` + (selected ? "　→ 貼りたい枠をタップ" : "") : "全部貼れました。「確認する」を押そう";
    if (selected) for (const { el } of bucketEls.values()) el.classList.add("hot");
  }
  render();
  const labelOf = (id) => s.buckets.find((b) => b.id === id)?.label;

  return {
    el: [qTitle(s), h("p", { class: "small muted" }, "付箋をタップしてから、貼りたい枠をタップします（パソコンならドラッグでも動かせます）。"), left, tray, grid],
    mode: "check",
    ready: () => place.size === items.length,
    check() {
      const lines = [];
      for (const it of items) {
        const n = noteEls.get(it);
        const ok = place.get(it) === it.b;
        n.classList.toggle("bad", !ok);
        n.classList.toggle("good", ok);
        if (!ok) lines.push(`「${it.text}」→ 正しくは <b>${labelOf(it.b)}</b>${it.why ? "：" + it.why : ""}`);
      }
      return { ok: lines.length === 0, lines };
    },
    solve() { items.forEach((it) => place.set(it, it.b)); selected = null; render(); },
    reveal() { this.solve(); items.forEach((it) => noteEls.get(it).classList.add("good")); },
  };
};

/* ---------- 順番に並べる ---------- */
Steps.order = (s, ctx) => {
  const items = s.items.map((text, i) => ({ text, i }));
  const pool = shuffled(items);
  const seq = [];
  const seqEl = h("ol", { class: "seqlist" });
  const poolEl = h("div", { class: "pool" });
  function render(marks) {
    seqEl.replaceChildren(...seq.map((it, pos) => {
      const li = h("li", { class: marks ? (it.i === pos ? "good" : "bad") : "" },
        h("button", { type: "button", onclick: () => { seq.splice(pos, 1); render(); ctx.onChange(); } }, rich("span", it.text)));
      return li;
    }));
    poolEl.replaceChildren(...pool.filter((it) => !seq.includes(it)).map((it) =>
      h("button", { type: "button", onclick: () => { seq.push(it); render(); ctx.onChange(); } }, rich("span", it.text))));
  }
  render();
  return {
    el: [qTitle(s), seqEl, poolEl],
    mode: "check",
    ready: () => seq.length === items.length,
    check() {
      render(true);
      const ok = seq.every((it, pos) => it.i === pos);
      const lines = ok ? [] : ["赤い行の位置が違います。並べ直してみよう（タップで外せます）。"];
      return { ok, lines };
    },
    solve() { seq.length = 0; seq.push(...items); render(); },
    reveal() { this.solve(); render(true); },
  };
};

/* ---------- 問題のある箇所を見つける ---------- */
Steps.spot = (s, ctx) => {
  const segs = s.segs.map((g, i) => ({ ...g, i }));
  const flagged = new Set();
  const btns = segs.map((g) => {
    const b = h("button", { class: "seg" + (s.mono ? " mono" : ""), type: "button", "aria-pressed": "false" },
      h("span", { class: "flag", "aria-hidden": "true" }), h("span", null, rich("span", g.text)));
    b.onclick = () => {
      if (flagged.has(g)) flagged.delete(g); else flagged.add(g);
      b.setAttribute("aria-pressed", String(flagged.has(g)));
      btns.forEach((x) => { x.classList.remove("good", "bad"); x.querySelector(".why")?.remove(); });
      ctx.onChange();
    };
    b._g = g;
    return b;
  });
  const need = segs.filter((g) => g.bad).length;
  const show = (all) => {
    for (const b of btns) {
      const g = b._g;
      b.classList.remove("good", "bad");
      b.querySelector(".why")?.remove();
      if (flagged.has(g) && g.bad) { b.classList.add("good"); if (g.why) b.lastChild.append(rich("span", g.why, { class: "why" })); }
      else if (flagged.has(g) && !g.bad) { b.classList.add("bad"); b.lastChild.append(rich("span", g.why || "ここは問題ありません。", { class: "why" })); }
      else if (all && g.bad) { b.classList.add("good"); b.setAttribute("aria-pressed", "true"); if (g.why) b.lastChild.append(rich("span", g.why, { class: "why" })); }
    }
  };
  return {
    el: [qTitle(s), h("p", { class: "small muted" }, `問題のある箇所をタップして印をつけます（全部で ${need} か所）。`), h("div", { class: "spot" }, btns)],
    mode: "check",
    ready: () => flagged.size > 0,
    check() {
      show(false);
      const hit = segs.filter((g) => g.bad && flagged.has(g)).length;
      const extra = segs.filter((g) => !g.bad && flagged.has(g)).length;
      const ok = hit === need && extra === 0;
      const lines = [];
      if (!ok) {
        lines.push(`見つけた問題：<b>${hit} / ${need}</b>`);
        if (extra) lines.push(`問題ではない箇所に <b>${extra}個</b> 印がついています。`);
        if (hit < need) lines.push(`あと <b>${need - hit}個</b> あります。`);
      }
      return { ok, lines };
    },
    solve() { flagged.clear(); segs.filter((g) => g.bad).forEach((g) => flagged.add(g)); btns.forEach((b) => b.setAttribute("aria-pressed", String(flagged.has(b._g)))); },
    reveal() { this.solve(); show(true); },
  };
};

/* ---------- 状態×イベント表を埋める ---------- */
function openPicker(title, opts, current, onPick) {
  const close = () => { ov.remove(); document.removeEventListener("keydown", esc); };
  const esc = (e) => { if (e.key === "Escape") close(); };
  const sheet = h("div", { class: "picker", role: "dialog", "aria-modal": "true", "aria-label": title },
    h("h4", null, title),
    ...opts.map((o, i) => h("button", { class: "opt", type: "button", "aria-pressed": String(i === current), onclick: () => { onPick(i); close(); } },
      h("span", { class: "mk-o", "aria-hidden": "true" }), h("span", null, o))),
    h("button", { class: "btn ghost sm", type: "button", onclick: close }, "閉じる"),
  );
  const ov = h("div", { class: "overlay", onclick: (e) => { if (e.target === ov) close(); } }, sheet);
  document.body.append(ov);
  document.addEventListener("keydown", esc);
  sheet.querySelector("button")?.focus();
}

Steps.grid = (s, ctx) => {
  const val = {};
  const cellBtns = {};
  const accepted = (k) => [].concat(s.ans[k]);
  const counter = h("span", { class: "emptycount" });
  const editable = [];
  s.rows.forEach((_, r) => s.cols.forEach((__, c) => { const k = r + "-" + c; if (!(s.given && k in s.given)) editable.push(k); }));
  const updateCount = () => {
    const n = editable.filter((k) => val[k] == null).length;
    counter.textContent = n ? `空欄 ${n} マス` : "空欄 0 マス";
    counter.classList.toggle("zero", n === 0);
  };
  const paint = (k) => {
    const b = cellBtns[k];
    b.classList.remove("bad", "good");
    if (val[k] == null) { b.classList.add("empty"); b.textContent = "？ タップして選ぶ"; }
    else { b.classList.remove("empty"); b.textContent = s.opts[val[k]]; }
  };
  const table = h("table", { class: "sx" },
    h("thead", null, h("tr", null, h("th", null, "状態＼イベント"), ...s.cols.map((c) => h("th", { html: c })))),
    h("tbody", null, ...s.rows.map((row, r) => h("tr", null,
      h("th", { html: row }),
      ...s.cols.map((col, c) => {
        const k = r + "-" + c;
        if (s.given && k in s.given) return h("td", null, h("div", { class: "given", html: s.given[k] }));
        const b = h("button", { class: "cellbtn empty", type: "button" });
        b.onclick = () => openPicker(`${row.replace(/<[^>]+>/g, "")} × ${col.replace(/<[^>]+>/g, "")}`, s.opts, val[k], (i) => { val[k] = i; paint(k); updateCount(); ctx.onChange(); });
        cellBtns[k] = b;
        return h("td", null, b);
      }),
    ))),
  );
  editable.forEach(paint);
  updateCount();
  return {
    el: [qTitle(s), h("div", { class: "row small" }, counter, h("span", { class: "muted" }, "マスをタップすると選択肢が出ます。灰色のマスは記入済みです。")), h("div", { class: "scroll-x" }, table)],
    mode: "check",
    ready: () => editable.every((k) => val[k] != null),
    check() {
      const lines = [];
      for (const k of editable) {
        const ok = accepted(k).includes(val[k]);
        cellBtns[k].classList.toggle("bad", !ok);
        cellBtns[k].classList.toggle("good", ok);
        if (!ok) {
          const [r, c] = k.split("-").map(Number);
          lines.push(`<b>${s.rows[r].replace(/<[^>]+>/g, "")} × ${s.cols[c].replace(/<[^>]+>/g, "")}</b>：${(s.notes && s.notes[k]) || "もう一度考えてみよう。"}`);
        }
      }
      return { ok: lines.length === 0, lines };
    },
    solve() { editable.forEach((k) => { val[k] = accepted(k)[0]; paint(k); }); updateCount(); },
    reveal() { this.solve(); editable.forEach((k) => cellBtns[k].classList.add("good")); },
  };
};

/* ---------- ヒアリング（会話シミュレーション） ---------- */
Steps.interview = (s, ctx) => {
  let left = s.budget;
  const got = new Set();
  const log = h("div", { class: "chatlog", "aria-live": "polite" });
  const budgetEl = h("span", { class: "budget" });
  const foundEl = h("div", { class: "found" });
  const chipsEl = h("div", { class: "qchips" });
  const summary = h("div", { class: "stack" });
  let finished = false;
  const say = (who, html) => {
    const w = WHO[who];
    log.append(h("div", { class: "bubble" + (who === "y" ? " you" : "") },
      h("div", { class: "av " + w.cls, "aria-hidden": "true" }, w.av),
      h("div", { class: "says" }, h("span", { class: "nm" }, w.name), rich("span", html))));
    log.scrollTop = log.scrollHeight;
  };
  const paintFound = () => {
    budgetEl.textContent = `残りの質問 ${left} 回`;
    foundEl.replaceChildren(...s.finds.map((f) => h("span", { class: "chip" + (got.has(f.id) ? " got" : "") }, got.has(f.id) ? "✓ " + f.label : "？ ？ ？")));
  };
  const finish = () => {
    if (finished) return;
    finished = true;
    chipsEl.querySelectorAll("button").forEach((b) => (b.disabled = true));
    const missed = s.finds.filter((f) => !got.has(f.id));
    summary.append(
      h("div", { class: "box " + (got.size >= s.pass ? "red" : "pen") },
        h("h4", null, `見つけた例外：${got.size} / ${s.finds.length}`),
        rich("p", got.size === s.finds.length ? "すべての例外を引き出せました。聞き上手！" : got.size >= s.pass ? "合格ライン突破。見逃した例外も確認しておこう。" : "例外は「普段の流れ」の外にあります。見逃したものを確認しよう。", { class: "small" }),
        missed.length ? h("ul", { class: "small" }, ...missed.map((f) => rich("li", `${f.label}（${s.qs.find((q) => q.f === f.id)?.q || ""} と聞けば分かった）`))) : null,
      ),
    );
    ctx.done({ xp: got.size * 6, badge: got.size === s.finds.length ? "interview" : null });
  };
  s.qs.forEach((q) => {
    const b = h("button", { class: "qchip", type: "button" }, q.q);
    b.onclick = () => {
      if (left <= 0 || finished) return;
      b.disabled = true;
      left--;
      say("y", q.q);
      setTimeout(() => {
        say(q.who || "o", q.a);
        if (q.f) got.add(q.f);
        log.append(h("p", { class: "coach" + (q.good ? "" : " bad") }, (q.f ? "例外を発見！ " : "") + q.coach));
        log.scrollTop = log.scrollHeight;
        paintFound();
        if (left === 0 || got.size === s.finds.length) finish();
      }, 320);
    };
    b._q = q;
    chipsEl.append(b);
  });
  if (s.intro) say("o", s.intro);
  paintFound();
  return {
    el: [qTitle(s), h("div", { class: "row small" }, budgetEl, h("span", { class: "muted" }, `合格ライン：例外を ${s.pass} 個`)), foundEl, log, chipsEl, summary],
    mode: "self",
    solve() {
      const best = s.qs.filter((q) => q.f).slice(0, s.budget);
      left = s.budget;
      best.forEach((q) => { const b = [...chipsEl.children].find((x) => x._q === q); b.disabled = true; left--; got.add(q.f); });
      paintFound();
      finish();
    },
  };
};

/* ---------- 画面のスタック（自由に触る） ---------- */
const NEXT_SCREENS = ["商品一覧", "商品詳細", "カート", "受け取り日時", "確認"];
function phoneView() {
  const view = h("div", { class: "stackview", "aria-live": "polite" });
  const msg = h("div", { class: "msgline" });
  const el = h("div", { class: "phone" }, h("div", { class: "notch" }), view, msg);
  return {
    el,
    show(stack, note) {
      view.replaceChildren(...stack.map((n, i) => h("div", { class: "scr" }, n, h("small", null, i === stack.length - 1 ? "表示中" : ""))));
      msg.textContent = note || "";
    },
  };
}

Steps.stackplay = (s, ctx) => {
  let stack = ["ホーム"];
  const count = { push: 0, replace: 0, reset: 0, back: 0 };
  const phone = phoneView();
  const taskEls = s.tasks.map((t) => h("li", null, t.label));
  let finished = false;
  const update = (note) => {
    phone.show(stack, note);
    s.tasks.forEach((t, i) => taskEls[i].classList.toggle("on", Object.entries(t.need).every(([k, n]) => count[k] >= n)));
    if (!finished && taskEls.every((li) => li.classList.contains("on"))) { finished = true; ctx.done({ xp: 10 }); }
  };
  const act = (kind) => {
    count[kind]++;
    if (kind === "push") stack.push(NEXT_SCREENS[Math.min(stack.length - 1, NEXT_SCREENS.length - 1)]);
    if (kind === "replace") stack[stack.length - 1] = "予約完了";
    if (kind === "reset") stack = ["ホーム"];
    if (kind === "back") {
      if (stack.length === 1) { update("一番下の画面で戻る → アプリが裏へ回りました"); return; }
      stack.pop();
    }
    update({ push: "上に1枚積みました", replace: "一番上を入れ替えました", reset: "全部捨てて置き直しました", back: "一番上を1枚取りました" }[kind]);
  };
  const controls = h("div", { class: "stack", style: { gap: "8px" } },
    h("button", { class: "btn sm", type: "button", onclick: () => act("push") }, "push：次の画面を積む"),
    h("button", { class: "btn sm", type: "button", onclick: () => act("replace") }, "replace：完了画面に入れ替える"),
    h("button", { class: "btn sm", type: "button", onclick: () => act("reset") }, "reset：ホームだけにする"),
    h("button", { class: "btn sm primary", type: "button", onclick: () => act("back") }, "← 戻る"),
  );
  update("");
  return {
    el: [qTitle(s), h("div", { class: "stackgrid" }, phone.el, h("div", { class: "stack" }, controls, h("div", null, h("p", { class: "small", style: { fontWeight: 700 } }, "やってみること"), h("ul", { class: "tasks" }, taskEls))))],
    mode: "self",
    solve() { Object.keys(count).forEach((k) => (count[k] = 9)); update(""); },
  };
};

/* ---------- 画面のスタック（方式を選ぶ練習） ---------- */
function applyMove(stack, how, to) {
  if (how === "push") return [...stack, to];
  if (how === "replace") return [...stack.slice(0, -1), to];
  if (how === "reset") return s_resetTarget(to);
  return stack;
}
function s_resetTarget(to) { return to === "ホーム" ? ["ホーム"] : ["ホーム", to].filter((x, i, a) => a.indexOf(x) === i); }

Steps.stack = (s, ctx) => {
  const pick = s.moves.map(() => null);
  const phone = phoneView();
  const moveEls = [];
  const replay = () => {
    let st = s.start.slice();
    for (let i = 0; i < s.moves.length; i++) {
      if (!pick[i]) break;
      st = s.moves[i].resetTo && pick[i] === "reset" ? s.moves[i].resetTo.slice() : applyMove(st, pick[i], s.moves[i].to);
    }
    phone.show(st, pick.every(Boolean) ? "戻るを押すと → " + (st.length > 1 ? st[st.length - 2] : "アプリが裏へ") : "");
  };
  s.moves.forEach((m, i) => {
    const seg = h("div", { class: "seg3", role: "group", "aria-label": m.label });
    ["push", "replace", "reset"].forEach((how) => {
      const b = h("button", { type: "button", "aria-pressed": "false" }, how);
      b.onclick = () => {
        pick[i] = how;
        seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        moveEls[i].classList.remove("bad", "good");
        moveEls[i].querySelector(".why")?.remove();
        replay();
        ctx.onChange();
      };
      seg.append(b);
    });
    const el = h("div", { class: "move" }, h("div", { class: "small" }, h("b", null, `${i + 1}. `), rich("span", m.label)), seg);
    moveEls.push(el);
  });
  replay();
  return {
    el: [qTitle(s), h("div", { class: "stackgrid" }, phone.el, h("div", { class: "moves" }, moveEls))],
    mode: "check",
    ready: () => pick.every(Boolean),
    check() {
      const lines = [];
      s.moves.forEach((m, i) => {
        const ok = m.ans.includes(pick[i]);
        moveEls[i].classList.toggle("bad", !ok);
        moveEls[i].classList.toggle("good", ok);
        moveEls[i].querySelector(".why")?.remove();
        if (!ok) { lines.push(`${i + 1}. ${m.label.replace(/<[^>]+>/g, "")} → <b>${m.ans.join(" または ")}</b>：${m.why}`); }
        else if (m.why) moveEls[i].append(rich("p", m.why, { class: "why small hand" }));
      });
      return { ok: lines.length === 0, lines };
    },
    solve() {
      s.moves.forEach((m, i) => { pick[i] = m.ans[0]; moveEls[i].querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.textContent === pick[i]))); });
      replay();
    },
    reveal() { this.solve(); moveEls.forEach((el) => el.classList.add("good")); },
  };
};

/* ---------- 通信の実験室（切断と冪等キー） ---------- */
Steps.seq = (s, ctx) => {
  let idem = false;
  let saved = 0;
  let pending = null; // 失敗したあとの再試行待ち {cut: "before"|"after"}
  const seen = new Set();
  const done = { dup: false, safe: false, before: false };
  const track = h("div", { class: "track" });
  const savedEl = h("div", { class: "counter" }, "この注文で保存された予約", h("b", null, "0"), "件");
  const appEl = h("div", { class: "counter" }, "アプリの表示：", h("b", { style: { fontSize: "15px" } }, "—"));
  const tasks = [
    ["dup", "冪等キーなしで「返る途中で切れる」→ 再試行して、二重予約を起こしてみる"],
    ["safe", "冪等キーありで同じことをして、予約が1件のままになるのを確かめる"],
    ["before", "「届く前に切れる」→ 再試行は、どちらでも1件になることを確かめる"],
  ];
  const taskEls = Object.fromEntries(tasks.map(([k, t]) => [k, h("li", null, t)]));
  const arrow = (from, to, text, opts = {}) => {
    const cls = "arrow" + (opts.back ? " back" : "") + (opts.cut ? " cut" : "") + (opts.self ? " self" : "");
    track.append(h("div", { class: cls }, h("div", { class: "ln", style: { "--from": from, "--to": to } }, text)));
  };
  const paint = (appText) => {
    savedEl.querySelector("b").textContent = String(saved);
    savedEl.classList.toggle("alert", saved > 1);
    if (appText) appEl.querySelector("b").textContent = appText;
    retryBtn.disabled = !pending;
    Object.entries(done).forEach(([k, v]) => taskEls[k].classList.toggle("on", v));
    if (done.dup && done.safe && done.before && !finished) { finished = true; ctx.done({ xp: 25, badge: "double" }); }
  };
  let finished = false;
  let reqId = "";
  const serverSave = () => {
    if (idem && seen.has(reqId)) {
      arrow(2, 3, `${reqId} は処理済み → 保存済みの結果を返す`, { self: true });
      return;
    }
    seen.add(reqId);
    saved++;
    arrow(2, 3, `予約を保存（${saved}件目）`, { self: true });
  };
  const start = (cut) => {
    track.replaceChildren();
    saved = 0;
    pending = null;
    seen.clear();
    reqId = "req-" + Math.random().toString(36).slice(2, 6);
    const label = idem ? `予約する（request_id=${reqId}）` : "予約する";
    if (cut === "before") {
      arrow(1, 3, label + " … 届く前に切断", { cut: true });
      pending = { cut };
      paint("失敗（再試行してください）");
      return;
    }
    arrow(1, 3, label);
    serverSave();
    if (cut === "after") {
      arrow(1, 3, "完了しました … 返る途中で切断", { back: true, cut: true });
      pending = { cut };
      paint("失敗（再試行してください）");
      return;
    }
    arrow(1, 3, "完了しました", { back: true });
    paint("予約完了");
  };
  const retry = () => {
    if (!pending) return;
    const cut = pending.cut;
    if (!idem) reqId = "req-" + Math.random().toString(36).slice(2, 6);
    arrow(1, 3, idem ? `再試行（同じ request_id=${reqId}）` : "再試行（新しい依頼として送る）");
    serverSave();
    arrow(1, 3, "完了しました", { back: true });
    pending = null;
    if (cut === "after" && !idem && saved >= 2) done.dup = true;
    if (cut === "after" && idem && saved === 1) done.safe = true;
    if (cut === "before" && saved === 1) done.before = true;
    paint(saved > 1 ? "予約完了（でも裏では2件！）" : "予約完了");
  };
  const idemBox = h("input", { type: "checkbox", id: "idem-" + ctx.key.replace(/[^a-z0-9]/gi, "") });
  idemBox.onchange = () => { idem = idemBox.checked; track.replaceChildren(); saved = 0; pending = null; paint("—"); };
  const retryBtn = h("button", { class: "btn red sm", type: "button", onclick: retry, disabled: true }, "再試行する");
  const lab = h("div", { class: "lab" },
    h("label", { class: "toggle", for: idemBox.id }, idemBox, "冪等キー（request_id）を使う"),
    h("div", { class: "row" },
      h("button", { class: "btn sm", type: "button", onclick: () => start(null) }, "ふつうに予約する"),
      h("button", { class: "btn sm", type: "button", onclick: () => start("before") }, "届く前に切れる"),
      h("button", { class: "btn sm", type: "button", onclick: () => start("after") }, "返る途中で切れる"),
      retryBtn,
    ),
    h("div", { class: "lanes" }, h("div", { class: "lane" }, "アプリ"), h("div", { class: "lane" }, "サーバー"), h("div", { class: "lane" }, "予約データ")),
    track,
    h("div", { class: "counters" }, savedEl, appEl),
    h("ul", { class: "tasks" }, Object.values(taskEls)),
  );
  paint("—");
  return {
    el: [qTitle(s), lab],
    mode: "self",
    solve() { done.dup = done.safe = done.before = true; paint(); },
  };
};

/* ---------- 点数をつけて Tier を決める ---------- */
function tierOf(i, f, r) {
  if (r >= 4) return 0;
  const sc = i * f * r;
  return sc >= 24 ? 0 : sc >= 8 ? 1 : 2;
}
Steps.score = (s, ctx) => {
  const vals = s.items.map(() => ({ i: 0, f: 0, r: 0 }));
  const rows = [];
  const axes = [["i", "影響の大きさ", 4], ["f", "起きる頻度", 3], ["r", "取り返しのつかなさ", 4]];
  s.items.forEach((it, n) => {
    const out = h("span", { class: "tierchip" }, "—");
    const box = h("div", { class: "scoreitem" }, rich("div", "<b>" + it.text + "</b>"));
    for (const [k, label, max] of axes) {
      const seg = h("div", { class: "seg3", role: "group", "aria-label": label });
      for (let v = 1; v <= max; v++) {
        const b = h("button", { type: "button", "aria-pressed": "false" }, String(v));
        b.onclick = () => {
          vals[n][k] = v;
          seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
          const { i, f, r } = vals[n];
          box.classList.remove("good", "bad");
          box.querySelector(".why")?.remove();
          out.textContent = i && f && r ? `${i}×${f}×${r}＝${i * f * r} → Tier${tierOf(i, f, r)}` : "—";
          ctx.onChange();
        };
        seg.append(b);
      }
      box.append(h("div", { class: "scorerow" }, h("span", { class: "lbl" }, label), seg));
    }
    box.append(h("div", { class: "scorerow" }, h("span", { class: "lbl" }, "判定"), out));
    rows.push({ box, out });
  });
  return {
    el: [qTitle(s), rich("div", "影響 1〜4 × 頻度 1〜3 × 取り返し 1〜4。<b>24以上はTier0、8〜23はTier1、7以下はTier2</b>。ただし<b>取り返し4は頻度に関係なくTier0</b>。", { class: "small muted" }), h("div", { class: "stack" }, rows.map((r) => r.box))],
    mode: "check",
    ready: () => vals.every((v) => v.i && v.f && v.r),
    check() {
      const lines = [];
      s.items.forEach((it, n) => {
        const { i, f, r } = vals[n];
        const ok = tierOf(i, f, r) === it.expect;
        rows[n].box.classList.toggle("good", ok);
        rows[n].box.classList.toggle("bad", !ok);
        rows[n].box.querySelector(".why")?.remove();
        rows[n].box.append(rich("p", `目安：影響${it.sug[0]}・頻度${it.sug[1]}・取り返し${it.sug[2]} → Tier${it.expect}。${it.why}`, { class: "why small hand" }));
        if (!ok) lines.push(`「${it.text}」は <b>Tier${it.expect}</b> が目安です。`);
      });
      return { ok: lines.length === 0, lines };
    },
    solve() {
      s.items.forEach((it, n) => {
        const [i, f, r] = it.sug;
        Object.assign(vals[n], { i, f, r });
        const segs = rows[n].box.querySelectorAll(".seg3");
        [i, f, r].forEach((v, a) => segs[a].querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.textContent === String(v)))));
        rows[n].out.textContent = `${i}×${f}×${r}＝${i * f * r} → Tier${tierOf(i, f, r)}`;
      });
    },
    reveal() { this.solve(); this.check(); },
  };
};

/* ---------- 書く（見本と比べて自己チェック） ---------- */
Steps.write = (s, ctx) => {
  const saved = Store.state.answers[ctx.key];
  const ta = h("textarea", { class: "w", id: "w-" + ctx.key.replace(/[^a-z0-9]/gi, "-"), rows: s.rows || 8, placeholder: s.placeholder || "" });
  ta.value = saved != null ? saved : s.template || "";
  const count = h("div", { class: "count" });
  const after = h("div", { class: "stack" });
  const min = s.min ?? 40;
  const showBtn = h("button", { class: "btn primary", type: "button" }, "書けた！見本と比べる");
  let finished = false;
  const save = debounce(() => Store.save(), 500);
  const persist = () => { Store.state.answers[ctx.key] = ta.value; save(); };
  const upd = () => {
    const n = ta.value.replace(/\s/g, "").length;
    count.textContent = `${n} 文字` + (n < min ? `（あと ${min - n} 文字で見本を見られます）` : "");
    showBtn.disabled = n < min;
  };
  ta.oninput = () => { upd(); persist(); };
  upd();
  const checkEls = (s.checks || []).map((c, i) => {
    const id = `ck-${ctx.key.replace(/[^a-z0-9]/gi, "-")}-${i}`;
    const box = h("input", { type: "checkbox", id });
    box.onchange = () => {
      if (!finished && checkEls.every((x) => x.box.checked)) { finished = true; ctx.done({ xp: s.mission ? 30 : 20, mission: !!s.mission }); }
    };
    return { box, el: h("label", { for: id }, box, h("span", { html: c })) };
  });
  const reveal = () => {
    showBtn.hidden = true;
    after.replaceChildren(
      h("div", { class: "model" }, h("h4", null, "見本（答えは1つではありません）"), h("div", { class: "body", html: s.model })),
      checkEls.length ? h("div", { class: "stack", style: { gap: "8px" } }, h("p", { class: "small", style: { fontWeight: 700 } }, "自分の答えをチェックしよう（全部チェックで完了。足りなければ上で書き直してOK）"), h("div", { class: "checks" }, checkEls.map((c) => c.el))) : null,
      coachBox(() => ({ task: (s.task || s.q || "").replace(/<[^>]+>/g, ""), rubric: s.rubric || s.checks?.map((c) => c.replace(/<[^>]+>/g, "")) || [], answer: ta.value, example: s.model.replace(/<[^>]+>/g, "") })),
    );
    if (!checkEls.length && !finished) { finished = true; ctx.done({ xp: 20 }); }
  };
  showBtn.onclick = reveal;
  const head = s.mission ? h("div", { class: "row" }, h("span", { class: "mission-tag" }, "実践ミッション"), h("span", { class: "small muted" }, "スマホや身の回りで実際にやってみよう")) : null;
  return {
    el: [head, qTitle(s), s.hint ? rich("div", s.hint, { class: "small muted body" }) : null, ta, count, showBtn, after],
    mode: "self",
    cls: s.mission ? "mission" : "",
    solve() {
      if (ta.value.replace(/\s/g, "").length < min) ta.value = (s.model || "").replace(/<[^>]+>/g, "");
      upd();
      reveal();
      checkEls.forEach((c) => (c.box.checked = true));
      if (!finished) { finished = true; ctx.done({ xp: s.mission ? 30 : 20, mission: !!s.mission }); }
    },
  };
};

/* ---- engine/grad.js ---- */
/* ===== grad.js : 卒業制作（既存アプリを L0〜L5 で構造化する） ===== */

const Grad = {
  get d() {
    const g = Store.state.grad;
    g.app ??= { preset: "", name: "", feature: "" };
    g.l0 ??= { who: "", pain: "", success: "", notdo: "" };
    g.l1 ??= { lanes: [], steps: [], exc: [] };
    g.l2 ??= { name: "", actor: "", pre: "", trigger: "", basic: [], alt: [], exc: [], postOk: "", postNg: "" };
    g.l3 ??= { screens: [], trans: [], tried: "" };
    g.l4 ??= { app: [], screen: [], op: [] };
    g.l4t ??= { states: [], events: [], cells: {} };
    g.l5 ??= { arrows: [], key: "" };
    g.prio ??= { items: [], known: "" };
    g.final ??= { reflect: "" };
    return g;
  },
  preset() { return GRAD_PRESETS.find((p) => p.id === this.d.app.preset) || null; },
  persist: debounce(() => Store.save(), 500),

  /** 各パートの「最低限ここまで書けた」 */
  minOk(part) {
    const d = this.d;
    const f = (x) => (x || "").trim().length > 0;
    const n = (a) => a.filter((x) => (typeof x === "string" ? f(x) : f(x.text) || f(x.msg) || f(x.from))).length;
    switch (part) {
      case "app": return f(d.app.name) && f(d.app.feature);
      case "l0": return f(d.l0.who) && f(d.l0.pain) && f(d.l0.success);
      case "l1": return n(d.l1.lanes) >= 2 && n(d.l1.steps) >= 4 && n(d.l1.exc) >= 2;
      case "l2": return f(d.l2.name) && n(d.l2.basic) >= 3 && n(d.l2.exc) >= 2 && f(d.l2.postOk) && f(d.l2.postNg);
      case "l3": return n(d.l3.screens) >= 3 && d.l3.trans.filter((t) => f(t.from) && f(t.to) && t.how).length >= 4;
      case "l4": return n(d.l4.app) >= 2 && n(d.l4.screen) >= 2 && n(d.l4.op) >= 2;
      case "l4t": return n(d.l4t.states) >= 3 && n(d.l4t.events) >= 4 && this.emptyCells() === 0;
      case "l5": return n(d.l5.arrows) >= 3 && f(d.l5.key);
      case "prio": return d.prio.items.filter((x) => f(x.text) && x.tier !== "").length >= 3 && d.prio.items.some((x) => x.tier === "0") && f(d.prio.known);
      case "final": return (d.final.reflect || "").replace(/\s/g, "").length >= 30;
    }
    return false;
  },
  missingText(part) {
    return {
      app: "アプリ名と、構造化する機能を書こう。",
      l0: "「誰の」「何の困りごと」「成功の目印」を書こう。",
      l1: "レーンを2つ以上、流れの箱を4つ以上、例外を2つ以上書こう。",
      l2: "名前・基本フロー3行以上・例外フロー2つ以上・事後条件（成功時と失敗時）を書こう。",
      l3: "画面を3つ以上、遷移を4行以上（方式まで）書こう。",
      l4: "3つの層それぞれに、状態を2つ以上書こう。",
      l4t: "状態3つ以上・イベント4つ以上にして、空欄を0にしよう。",
      l5: "矢印を3本以上と、冪等キーの使い方を書こう。",
      prio: "3つ以上に Tier をつけ（Tier0 を1つ以上）、既知の挙動を1つ書こう。",
      final: "振り返りを30文字以上書こう。",
    }[part];
  },

  emptyCells() {
    const t = this.d.l4t;
    const st = t.states.filter((x) => x.trim()), ev = t.events.filter((x) => x.trim());
    let empty = 0;
    st.forEach((s) => ev.forEach((e) => { if (!(t.cells[s + "|" + e] || "").trim()) empty++; }));
    return empty;
  },

  /* ----- 部品 ----- */
  field(label, obj, key, { hint, rows = 2, ph = "" } = {}) {

  list(label, arr, { hint, ph = "", min = 3, numbered = true } = {}) {

        return h("div", { class: "li" }, h("span", { class: "n" }, numbered ? i + 1 : "・"), inp, x);

  rows(rows, cols, { add, min = 3 } = {}) {

      box.replaceChildren(
        h("div", { class: "tr hd", style: { gridTemplateColumns: cols.map((c) => c.w || "minmax(0,1fr)").join(" ") + " 32px" } }, ...cols.map((c) => h("span", null, c.label)), h("span")),

              sel.value = r[c.key] ?? "";

            const inp = h("input", { type: "text", value: r[c.key] || "", placeholder: c.ph || c.label, "aria-label": c.label });
            inp.oninput = () => { r[c.key] = inp.value; this.persist(); this.changed(); };
            return inp;
          });
          const x = h("button", { class: "xbtn", type: "button", "aria-label": "この行を消す", onclick: () => { rows.splice(i, 1); paint(); this.persist(); this.changed(); } }, "×");
          return h("div", { class: "tr", style: { gridTemplateColumns: cols.map((c) => c.w || "minmax(0,1fr)").join(" ") + " 32px" } }, ...cells, x);
        }),
        h("div", null, h("button", { class: "btn ghost sm", type: "button", onclick: () => { rows.push(add()); paint(); } }, "＋ 行を足す")),

  suggest(label, words, onPick) {

    return h("div", { class: "row small" }, h("span", { class: "muted" }, label), ...words.map((w) => h("button", { class: "chip", type: "button", onclick: () => onPick(w) }, "＋ " + w)));
  },

        this.list("アプリ全体の状態", d.l4.app, { min: 2, ph: "例：ログイン済み／オフライン", numbered: false }),
        this.list("画面の状態（初期・読み込み中・0件・表示中・エラー…）", d.l4.screen, { min: 3, ph: "例：店一覧の読み込み中", numbered: false }),
        this.suggest("操作の状態の候補：", p?.states, (w) => { if (!d.l4.op.includes(w)) { const i = d.l4.op.findIndex((x) => !x.trim()); if (i >= 0) d.l4.op[i] = w; else d.l4.op.push(w); this.persist(); rerender(); } }),

              const quick = h("div", { class: "row", style: { gap: "4px", padding: "0 6px 6px" } },
                ...["無視する", "要検討"].map((w) => h("button", { class: "chip", type: "button", onclick: () => { ta.value = w; ta.oninput(); } }, w)));
              return h("td", null, ta, quick);

        const stList = this.list("状態（行）", t.states, { min: 4, numbered: false, ph: "例：注文送信中" });
        const evList = this.list("イベント（列）", t.events, { min: 5, numbered: false, ph: "例：連打", hint: "ユーザー操作・通信・アプリ全体・時間の4種類から集める" });
        [stList, evList].forEach((el) => el.addEventListener("input", listsChanged));
        [stList, evList].forEach((el) => el.addEventListener("click", (e) => { if (e.target.closest("button")) setTimeout(listsChanged, 0); }));
        paintGrid();
        return [

          this.suggest("イベントの候補：", p?.events, (w) => { if (!t.events.includes(w)) { const i = t.events.findIndex((x) => !x.trim()); if (i >= 0) t.events[i] = w; else t.events.push(w); this.persist(); rerender(); } }),
          h("div", { class: "row small" }, counter, h("span", { class: "muted" }, "全マスに「どうなるか」を書く。「無視する」も立派な仕様。")),
